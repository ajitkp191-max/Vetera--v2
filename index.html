<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Vetera V2 Veterinary Practice Management System">
<title>Vetera V2 — Veterinary Practice Management</title>
<style>
:root{--bg:#050b14;--panel:#0b1728;--panel2:#10243a;--text:#f5f9ff;--muted:#91a6bb;--primary:#34d399;--cyan:#38d9f5;--blue:#60a5fa;--warn:#fbbf24;--danger:#fb7185;--border:rgba(150,190,225,.18);--shadow:0 18px 55px rgba(0,0,0,.3)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(52,211,153,.1),transparent 28%),radial-gradient(circle at 90% 10%,rgba(56,217,245,.1),transparent 30%),linear-gradient(135deg,#040912,#081321 52%,#050b14);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:66px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(4,11,20,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--cyan));color:#03121a;box-shadow:0 0 28px rgba(56,217,245,.2)}.topright{display:flex;align-items:center;gap:8px}.pill{padding:7px 10px;border:1px solid var(--border);border-radius:12px;background:rgba(10,25,41,.8)}.role{color:var(--cyan);font-size:11px}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 66px)}aside{position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto;padding:14px 11px;border-right:1px solid var(--border);background:rgba(4,12,22,.6)}.nav-title{margin:13px 8px 6px;color:#688098;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.13em}.nav button{width:100%;padding:10px 11px;margin:2px 0;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--muted);transition:.2s}.nav button:hover{background:rgba(56,217,245,.07);color:var(--text);transform:translateX(2px)}.nav button.active{background:linear-gradient(90deg,rgba(52,211,153,.14),rgba(56,217,245,.08));color:#fff;box-shadow:inset 3px 0 var(--cyan)}main{padding:22px;max-width:1650px;width:100%;margin:auto}.page{display:none;animation:in .3s ease}.page.active{display:block}.title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 12px;border-radius:10px;background:#10243a;color:#fff;border:1px solid var(--border);transition:.18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.primary{background:linear-gradient(135deg,#2dd486,#34d399);color:#03130b;border:0;font-weight:800}.cyan{background:linear-gradient(135deg,#32d5ee,#38d9f5);color:#03151a;border:0;font-weight:800}.danger{background:#45191e;color:#ffaaa9;border-color:#732b32}.warn{background:#49320d;color:#ffd986;border-color:#76551d}.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(6,minmax(120px,1fr))}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(145deg,rgba(16,35,58,.92),rgba(8,21,36,.9));border:1px solid var(--border);border-radius:16px;padding:15px;box-shadow:var(--shadow)}.card:hover{border-color:rgba(56,217,245,.26)}.stat-label,.muted{color:var(--muted)}.stat-value{font-size:26px;font-weight:900;margin-top:6px}.icon{float:right;font-size:21px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h3{margin:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid rgba(150,190,225,.12);text-align:left;white-space:nowrap}.table th{font-size:10px;color:#7891aa;text-transform:uppercase;letter-spacing:.05em}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#103821;color:#6ee7a0}.pending{background:#3d2e0d;color:#ffd36a}.bad{background:#46191e;color:#ff9b9b}.info{background:#11374a;color:#7ce8fa}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.form.three{grid-template-columns:repeat(3,1fr)}.field label{display:block;color:#9eb2c5;font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:#06111e;color:#fff;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(56,217,245,.65);box-shadow:0 0 0 3px rgba(56,217,245,.07)}textarea{min-height:85px;resize:vertical}.span2{grid-column:1/-1}.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1}.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1c3045}.timeline{border-left:2px solid #29465c;padding-left:18px;margin-left:7px}.event{position:relative;padding-bottom:17px}.event:before{content:'';position:absolute;left:-24px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(56,217,245,.08)}.event small{display:block;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:13px}.tab{padding:8px 10px;white-space:nowrap;border:1px solid var(--border);border-radius:9px;background:#0b1b2c;color:var(--muted)}.tab.active{color:var(--cyan);background:#17384b;border-color:#28596c}.modal{display:none;position:fixed;inset:0;z-index:80;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.74);backdrop-filter:blur(7px)}.modal.show{display:flex}.modalbox{width:min(1000px,100%);max-height:94vh;overflow:auto;background:linear-gradient(145deg,#0d2034,#071625);border:1px solid rgba(56,217,245,.2);border-radius:18px;padding:18px;box-shadow:0 25px 100px rgba(0,0,0,.55)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{background:none;border:0;color:#9db1c4;font-size:26px}.toast{position:fixed;right:14px;bottom:14px;z-index:100;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:#142b42;box-shadow:var(--shadow);animation:in .25s ease}.mobile{display:none}.alert{padding:10px 12px;border-radius:9px;background:#42300d;color:#ffda87;border:1px solid #71521e;margin-bottom:9px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(460px,100%);padding:27px;background:rgba(11,27,45,.82);border:1px solid var(--border);border-radius:22px;box-shadow:0 30px 100px rgba(0,0,0,.48)}.loginbrand{text-align:center;margin-bottom:18px}.loginbrand .logo{margin:auto}.loginbrand h1{font-size:31px;margin:9px 0 3px}.demo{font-size:11px;color:#8199ae;background:#0a1828;padding:9px;border-radius:8px;margin-top:11px}.hide{display:none!important}.chart{height:190px;display:flex;align-items:end;gap:8px}.bar{flex:1;background:linear-gradient(180deg,var(--cyan),#155e75);border-radius:7px 7px 2px 2px;min-width:9px;position:relative}.bar span{position:absolute;top:-18px;width:100%;text-align:center;font-size:10px;color:var(--muted)}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.three,.four{grid-template-columns:1fr 1fr}}@media(max-width:760px){.layout{display:block}aside{display:none}main{padding:13px 11px 75px}.top{height:59px;padding:0 11px}.topright .pill span:first-child{display:none}.stats{grid-template-columns:1fr 1fr}.three,.four,.form,.form.three{grid-template-columns:1fr}.title{align-items:flex-start;flex-direction:column}.title .actions{width:100%}.title .actions .btn{flex:1}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;justify-content:space-around;padding:6px;background:rgba(4,13,24,.9);border-top:1px solid var(--border);backdrop-filter:blur(15px)}.mobile button{background:none;border:0;color:var(--muted);font-size:10px}.mobile button.active{color:var(--cyan)}.modalbox{padding:14px}.span2{grid-column:auto}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="loginbrand"><div class="logo">🐾</div><h1>Vetera</h1><div class="muted">Veterinary Practice Management — V2</div></div><div class="tabs"><button id="lo" class="tab active" onclick="loginRole='owner';lo.classList.add('active');ls.classList.remove('active')">Pet Owner</button><button id="ls" class="tab" onclick="loginRole='staff';ls.classList.add('active');lo.classList.remove('active')">Veterinary Staff</button></div><form onsubmit="signin(event)"><div class="form"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="owner@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div></div><br><button class="btn primary" style="width:100%">Sign In</button></form><div class="actions" style="margin-top:10px"><button class="btn" style="flex:1" onclick="demo('owner')">Demo Owner</button><button class="btn" style="flex:1" onclick="demo('staff')">Demo Vet</button><button class="btn warn" style="flex:1" onclick="demo('admin')">Demo Admin</button></div><div class="demo">Prototype only: authentication and clinical records are local. Production deployment must use a secure backend, hashed passwords, authorization and encrypted storage.</div></div></div>
<div id="app" class="hide"><header class="top"><div class="brand"><div class="logo">🐾</div>Vetera <span class="muted" style="font-size:11px">V2</span></div><div class="topright"><button class="btn small" onclick="notifications()">🔔 <span id="ncount">0</span></button><div class="pill">👤 <span id="uname">User</span> · <span id="urole" class="role">Staff</span></div><button class="btn small" onclick="logout()">Logout</button></div></header><div class="layout"><aside><div class="nav" id="nav"></div></aside><main id="main"><section id="dashboard" class="page"></section><section id="patients" class="page"></section><section id="appointments" class="page"></section><section id="consultations" class="page"></section><section id="prescriptions" class="page"></section><section id="laboratory" class="page"></section><section id="imaging" class="page"></section><section id="surgery" class="page"></section><section id="hospital" class="page"></section><section id="dose" class="page"></section><section id="billing" class="page"></section><section id="inventory" class="page"></section><section id="reports" class="page"></section><section id="admin" class="page"></section><section id="settings" class="page"></section><section id="owner" class="page"></section></main></div><nav class="mobile" id="mobileNav"></nav></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div><div id="toast"></div>
<script>
const KEY='vetera_v2_demo'; const today=()=>new Date().toISOString().slice(0,10); const id=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); const date=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
function seed(){return {users:[{id:'u1',name:'Dr. Vet Admin',email:'vet@demo.com',password:'vet123',role:'staff',phone:'+91 9000000000'},{id:'u2',name:'Demo Owner',email:'owner@demo.com',password:'owner123',role:'owner',phone:'+91 9111111111'},{id:'u3',name:'Vetera Administrator',email:'admin@demo.com',password:'admin123',role:'admin',phone:'+91 9222222222'}],patients:[{id:'p1',patientNo:'VT-2026-0001',name:'Bruno',species:'Dog',breed:'Golden Retriever',sex:'Male',dob:'2023-05-14',weight:12,ownerId:'u2',microchip:'985141000001',status:'Active',allergies:['None known'],conditions:[],vaccinations:[{id:'v1',name:'Rabies',date:'2026-05-10',next:'2027-05-10',vet:'Dr. Vet Admin',batch:'RAB123',route:'SC',site:'Right flank',status:'Done'}],deworming:[{id:'d1',med:'Pyrantel',date:'2026-06-10',next:'2026-09-10',dose:'As prescribed',route:'PO',target:'Roundworms',vet:'Dr. Vet Admin',status:'Done'}],consultations:[{id:'c1',date:'2026-08-20',vet:'Dr. Vet Admin',complaint:'Skin itching',history:'2 weeks',findings:'Pruritus and erythema',diagnosis:'Dermatitis',plan:'Topical therapy and follow-up',exam:{temp:'38.7 C',pulse:'110',resp:'24',crt:'<2 sec',mm:'Pink',hydration:'Normal',bcs:'5/9',pain:'1/10'}}],prescriptions:[],labs:[{id:'l1',date:'2026-08-20',test:'CBC',result:'WBC 14.2 K/µL',flag:'Normal',report:''}],imaging:[],surgeries:[],anesthesia:[],hospitalizations:[],weightHistory:[{date:'2026-06-01',weight:10.8},{date:'2026-07-01',weight:11.5},{date:'2026-08-20',weight:12}],invoices:[{id:'i1',date:'2026-08-20',items:[{name:'Consultation',qty:1,price:500}],paid:500,status:'Paid'}],documents:[]}],appointments:[{id:'a1',patientId:'p1',date:today(),time:'10:30',reason:'Follow-up',doctor:'Dr. Vet Admin',status:'Confirmed'}],inventory:[{id:'m1',name:'Amoxicillin-Clavulanate',batch:'ACV22',stock:18,min:10,expiry:'2027-05-01',unit:'tablet'},{id:'m2',name:'Meloxicam',batch:'MEL31',stock:6,min:10,expiry:'2026-10-15',unit:'tablet'}],audit:[],settings:{clinic:'Vetera Veterinary Clinic',doctor:'Dr. Vet Admin',regNo:'VET-0001',phone:'+91 9000000000',address:'India'}}}
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed(),session=null,current='dashboard',selected=null,loginRole='owner';
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.getElementById('toast').appendChild(x);setTimeout(()=>x.remove(),2800)} function p(id){return db.patients.find(x=>x.id===id)} function u(id){return db.users.find(x=>x.id===id)||{name:'Unknown',email:'',phone:''}} function total(items=[]){return items.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0)} function age(d){if(!d)return'—';let a=new Date(),b=new Date(d),y=a.getFullYear()-b.getFullYear();if(a.getMonth()<b.getMonth()||(a.getMonth()===b.getMonth()&&a.getDate()<b.getDate()))y--;return y+' yr'} function allRecords(k){return db.patients.flatMap(x=>(x[k]||[]).map(r=>({...r,patient:x})))}
function audit(action,type,record){db.audit.push({id:id('audit'),time:new Date().toISOString(),user:session?.name||'System',action,type,record});if(db.audit.length>1000)db.audit.shift()}
const menus={staff:[['dashboard','▦ Dashboard'],['patients','🐾 Patients'],['appointments','📅 Appointments'],['consultations','🩺 Consultations'],['prescriptions','💊 Prescriptions'],['laboratory','🧪 Laboratory'],['imaging','🩻 Imaging & ECG'],['surgery','🔬 Surgery'],['hospital','🏥 Hospitalization'],['dose','⚗️ Dose Calculator'],['billing','₹ Billing'],['inventory','📦 Inventory'],['reports','📊 Reports'],['settings','⚙️ Settings']],admin:[['dashboard','▦ Dashboard'],['patients','🐾 Patients'],['appointments','📅 Appointments'],['admin','🛡️ Admin Center'],['reports','📊 Reports'],['inventory','📦 Inventory'],['billing','₹ Billing'],['settings','⚙️ Settings']],owner:[['owner','🐾 My Pets'],['appointments','📅 Appointments'],['settings','⚙️ Profile']]};
function buildNav(){let m=menus[session.role]||menus.staff;nav.innerHTML=m.map(([k,t])=>`<button data-page="${k}" onclick="go('${k}')">${t}</button>`).join('');mobileNav.innerHTML=m.slice(0,5).map(([k,t])=>`<button data-page="${k}" onclick="go('${k}')">${t.split(' ')[0]}<br>${t.split(' ').slice(1).join(' ')}</button>`).join('')}
function demo(r){let x=db.users.find(x=>x.role===r);email.value=x.email;password.value=x.password;loginRole=r;signin({preventDefault(){}})} function signin(e){e.preventDefault();let x=db.users.find(x=>x.email.toLowerCase()===email.value.trim().toLowerCase()&&x.password===password.value);if(!x)return toast('Invalid credentials');session=x;login.classList.add('hide');app.classList.remove('hide');uname.textContent=x.name;urole.textContent=x.role==='admin'?'Administrator':x.role==='owner'?'Pet Owner':'Veterinary Staff';buildNav();go(x.role==='owner'?'owner':'dashboard');updateCount()}
function logout(){session=null;app.classList.add('hide');login.classList.remove('hide');email.value='';password.value=''} function go(pg){if(session?.role==='owner'&&!['owner','appointments','settings'].includes(pg))pg='owner';current=pg;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let e=document.getElementById(pg)||dashboard;e.classList.add('active');document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===pg));render(pg)}
function render(pg){({dashboard:dashboardRender,patients:patientsRender,appointments:appointmentsRender,consultations:consultationsRender,prescriptions:rxRender,laboratory:labRender,imaging:imgRender,surgery:surgRender,hospital:hospRender,dose:doseRender,billing:billRender,inventory:invRender,reports:reportsRender,admin:adminRender,settings:settingsRender,owner:ownerRender}[pg]||dashboardRender)()}
function dashboardRender(){if(session.role==='owner')return ownerRender();let aps=db.appointments.filter(a=>a.date===today()),labs=allRecords('labs').length,due=reminders().length,critical=db.patients.filter(x=>x.status==='Critical').length,collected=db.patients.flatMap(x=>x.invoices||[]).reduce((s,i)=>s+(+i.paid||0),0);dashboard.innerHTML=`<div class="title"><div><h1>Clinical Dashboard</h1><p>${date(today())} · ${esc(db.settings.clinic)}</p></div><div class="actions"><button class="btn primary" onclick="patientModal()">+ Patient</button><button class="btn cyan" onclick="appointmentModal()">+ Appointment</button></div></div><div class="grid stats"><div class="card"><span class="icon">🐾</span><div class="stat-label">Patients</div><div class="stat-value">${db.patients.length}</div></div><div class="card"><span class="icon">📅</span><div class="stat-label">Today</div><div class="stat-value">${aps.length}</div></div><div class="card"><span class="icon">🔔</span><div class="stat-label">Reminders</div><div class="stat-value">${due}</div></div><div class="card"><span class="icon">🚨</span><div class="stat-label">Critical</div><div class="stat-value">${critical}</div></div><div class="card"><span class="icon">🧪</span><div class="stat-label">Lab Records</div><div class="stat-value">${labs}</div></div><div class="card"><span class="icon">₹</span><div class="stat-label">Collected</div><div class="stat-value">₹${collected}</div></div></div><br><div class="grid two"><div class="card"><div class="head"><h3>Today's Appointments</h3><button class="btn small" onclick="go('appointments')">View all</button></div>${aps.length?`<table class="table"><tr><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th></th></tr>${aps.map(a=>`<tr><td>${a.time}</td><td>${esc(p(a.patientId)?.name)}</td><td>${esc(a.reason)}</td><td>${badge(a.status)}</td><td><button class="btn small" onclick="openPatient('${a.patientId}')">Open</button></td></tr>`).join('')}</table>`:'<div class="muted">No appointments today.</div>'}</div><div class="card"><div class="head"><h3>Upcoming Reminders</h3><button class="btn small" onclick="notifications()">View</button></div>${reminders().slice(0,6).map(r=>`<div class="kpi"><span>${esc(r.type)} · <b>${esc(r.patient)}</b><br><small class="muted">${esc(r.item)}</small></span><span>${date(r.date)}</span></div>`).join('')||'<div class="muted">No reminders.</div>'}</div></div><br><div class="grid two"><div class="card"><h3>Patient Activity</h3><div class="chart">${[4,7,5,9,8,11,7,13,10,14,12,16].map((v,i)=>`<div class="bar" style="height:${v*9}px"><span>${v}</span></div>`).join('')}</div></div><div class="card"><h3>Species</h3>${['Dog','Cat','Other'].map(s=>`<div class="kpi"><span>${s}</span><b>${db.patients.filter(x=>s==='Other'?!['Dog','Cat'].includes(x.species):x.species===s).length}</b></div>`).join('')}</div></div>`}
function badge(s){let c=['Completed','Paid','Done','Active','Normal','Discharged','OK'].includes(s)?'ok':['Cancelled','Critical','Overdue','Low'].includes(s)?'bad':'pending';return `<span class="badge ${c}">${esc(s||'Pending')}</span>`}
function patientsRender(){let q=(document.getElementById('pq')?.value||'').toLowerCase(),arr=db.patients.filter(x=>`${x.name} ${x.patientNo} ${x.species} ${x.breed} ${u(x.ownerId).name}`.toLowerCase().includes(q));patients.innerHTML=`<div class="title"><div><h1>Patients</h1><p>Complete medical record, preventive care and timeline.</p></div><button class="btn primary" onclick="patientModal()">+ Register Patient</button></div><div class="card"><div class="search"><input id="pq" value="${esc(q)}" placeholder="Search patient, owner, species, breed or ID" oninput="patientsRender()"><button class="btn" onclick="pq.value='';patientsRender()">Clear</button></div><div class="grid three">${arr.map(x=>`<div class="card" style="cursor:pointer" onclick="openPatient('${x.id}')"><div class="head"><div><h3 style="margin:0">🐾 ${esc(x.name)}</h3><span class="muted">${esc(x.species)} · ${esc(x.breed)}</span></div><span>${badge(x.status)}</span></div><div class="grid three"><div><small class="muted">Age</small><br>${age(x.dob)}</div><div><small class="muted">Weight</small><br>${x.weight||'—'} kg</div><div><small class="muted">Owner</small><br>${esc(u(x.ownerId).name)}</div></div><p class="muted">${esc(x.patientNo)}</p></div>`).join('')||'<div class="muted">No patients found.</div>'}</div></div>`}
function openPatient(pid){selected=pid;let x=p(pid),o=u(x.ownerId);modalbox.innerHTML=`<div class="modalhead"><div><h2 style="margin:0">🐾 ${esc(x.name)} <span class="muted">${esc(x.patientNo)}</span></h2><div class="muted">${esc(x.species)} · ${esc(x.breed)} · ${esc(x.sex)} · ${x.weight} kg · ${age(x.dob)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="grid three"><div class="card"><b>Owner</b><br>${esc(o.name)}<br><small>${esc(o.phone)}<br>${esc(o.email)}</small></div><div class="card"><b>Alerts</b><br>${esc((x.allergies||[]).join(', ')||'None')}<br><small>${esc((x.conditions||[]).join(', ')||'No chronic conditions')}</small></div><div class="card"><b>Identification</b><br>Microchip: ${esc(x.microchip||'Not recorded')}<br>${badge(x.status)}</div></div><br><div class="tabs" id="ptabs">${['Overview','Consultations','Vaccination','Deworming','Prescription','Laboratory','Imaging','Surgery','Anesthesia','Hospitalization','Billing','Documents'].map((t,i)=>`<button class="tab ${i?'':'active'}" onclick="ptab('${t}',this)">${t}</button>`).join('')}</div><div id="ptc"></div>`;openModal();ptab('Overview',document.querySelector('#ptabs .tab'))}
function ptab(t,b){document.querySelectorAll('#ptabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');let x=p(selected),c=document.getElementById('ptc'),out='';if(t==='Overview'){let ev=[...(x.consultations||[]).map(r=>({d:r.date,t:'Consultation · '+(r.diagnosis||''),s:r.complaint||r.findings})),...(x.labs||[]).map(r=>({d:r.date,t:'Lab · '+r.test,s:r.result})),...(x.surgeries||[]).map(r=>({d:r.date,t:'Surgery · '+r.procedure,s:r.outcome}))].sort((a,b)=>b.d.localeCompare(a.d));out=`<div class="grid two"><div class="card"><div class="head"><h3>Clinical Timeline</h3><button class="btn small" onclick="consultModal('${x.id}')">+ Consultation</button></div><div class="timeline">${ev.map(r=>`<div class="event"><b>${esc(r.t)}</b><small>${date(r.d)}</small>${esc(r.s||'')}</div>`).join('')||'<div class="muted">No clinical events.</div>'}</div></div><div class="card"><h3>Weight History</h3>${weightChart(x.weightHistory||[])}</div></div>`}else if(t==='Consultations')out=recordTable('Consultations',['Date','Complaint','Diagnosis','Plan'],x.consultations||[],r=>[date(r.date),r.complaint,r.diagnosis,r.plan],()=>consultModal(x.id));else if(t==='Vaccination')out=recordTable('Vaccinations',['Vaccine','Date','Next Due','Vet','Batch','Status'],x.vaccinations||[],r=>[r.name,date(r.date),date(r.next),r.vet,r.batch,r.status],()=>vaccineModal(x.id));else if(t==='Deworming')out=recordTable('Deworming',['Product','Date','Next Due','Dose','Target'],x.deworming||[],r=>[r.med,date(r.date),date(r.next),r.dose,r.target],()=>dewormModal(x.id));else if(t==='Prescription')out=recordTable('Prescriptions',['Date','Medicine / File','Dose','Route','Frequency','Duration'],x.prescriptions||[],r=>[date(r.date),(r.medicine||'Uploaded Image')+(r.image?' 📷':''),r.dose||'—',r.route||'—',r.frequency||'—',r.duration||'—'],()=>rxModal(x.id));else if(t==='Laboratory')out=recordTable('Laboratory',['Date','Test','Result','Flag','Report'],x.labs||[],r=>[date(r.date),r.test,r.result,r.flag,r.report],()=>labModal(x.id));else if(t==='Imaging')out=recordTable('Imaging & ECG',['Date','Type','Region/Lead','Findings','Impression'],x.imaging||[],r=>[date(r.date),r.type,r.region,r.findings,r.impression],()=>imgModal(x.id));else if(t==='Surgery')out=recordTable('Surgery',['Date','Procedure','Surgeon','Anesthesia','Outcome'],x.surgeries||[],r=>[date(r.date),r.procedure,r.surgeon,r.anesthesia,r.outcome],()=>surgModal(x.id));else if(t==='Anesthesia')out=recordTable('Anesthesia',['Date','ASA','Premedication','Induction','Maintenance','Monitoring'],x.anesthesia||[],r=>[date(r.date),r.asa,r.premed,r.induction,r.maintenance,r.notes],()=>anModal(x.id));else if(t==='Hospitalization')out=recordTable('Hospitalization',['Admission','Discharge','Ward','Progress','Status'],x.hospitalizations||[],r=>[date(r.admit),date(r.discharge),r.ward,r.progress,r.status],()=>hospModal(x.id));else if(t==='Billing')out=recordTable('Invoices',['Date','Items','Total','Paid','Status'],x.invoices||[],r=>[date(r.date),(r.items||[]).map(i=>i.name).join(', '),'₹'+total(r.items),'₹'+(r.paid||0),r.status],()=>invoiceModal(x.id));else if(t==='Documents')out=recordTable('Documents',['Name','Date','Type','Reference'],x.documents||[],r=>[r.name,date(r.date),r.type,r.ref],()=>docModal(x.id));c.innerHTML=out}
function recordTable(title,heads,rows,map,add){return `<div class="card"><div class="head"><h3>${title}</h3><button class="btn primary small" onclick="${add.name?add.name+'()':'javascript:0'}">+ Add</button></div><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${map(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="muted">No records.</td></tr>`}</table></div>`}
function weightChart(a){if(!a.length)return'<div class="muted">No weight history.</div>';let max=Math.max(...a.map(x=>+x.weight));return`<div class="chart">${a.map(x=>`<div class="bar" style="height:${Math.max(25,+x.weight/max*165)}px"><span>${x.weight}kg</span></div>`).join('')}</div>`}
function appointmentsRender(){let rows=db.appointments.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));appointments.innerHTML=`<div class="title"><div><h1>Appointments</h1><p>Scheduling, follow-up and status workflow.</p></div><button class="btn primary" onclick="appointmentModal()">+ Appointment</button></div><div class="card"><table class="table"><tr><th>Date</th><th>Time</th><th>Patient</th><th>Owner</th><th>Reason</th><th>Doctor</th><th>Status</th><th></th></tr>${rows.map(a=>`<tr><td>${date(a.date)}</td><td>${a.time}</td><td>${esc(p(a.patientId)?.name)}</td><td>${esc(u(p(a.patientId)?.ownerId).name)}</td><td>${esc(a.reason)}</td><td>${esc(a.doctor)}</td><td>${badge(a.status)}</td><td><button class="btn small" onclick="openPatient('${a.patientId}')">Open</button></td></tr>`).join('')}</table></div>`}

function labRender(){genericModule('laboratory','Laboratory','CBC, biochemistry, urinalysis, cytology and diagnostic results.',allRecords('labs'),['Date','Patient','Test','Result','Flag','Report'],r=>[date(r.date),r.patient.name,r.test,r.result,r.flag,r.report],labModal)}
function imgRender(){genericModule('imaging','Imaging & ECG','X-ray, USG, CT, MRI and veterinary ECG records.',allRecords('imaging'),['Date','Patient','Type','Region / Lead','Findings','Impression'],r=>[date(r.date),r.patient.name,r.type,r.region,r.findings,r.impression],imgModal)}
function surgRender(){genericModule('surgery','Surgery','Pre-op, anesthesia, procedure, complications and post-op.',allRecords('surgeries'),['Date','Patient','Procedure','Surgeon','Anesthesia','Outcome'],r=>[date(r.date),r.patient.name,r.procedure,r.surgeon,r.anesthesia,r.outcome],surgModal)}
function hospRender(){genericModule('hospital','Hospitalization','Admission, ward/cage, progress and discharge.',allRecords('hospitalizations'),['Patient','Admission','Discharge','Ward','Progress','Status'],r=>[r.patient.name,date(r.admit),date(r.discharge),r.ward,r.progress,r.status],hospModal)}
function genericModule(el,title,sub,rows,heads,map,fn){document.getElementById(el).innerHTML=`<div class="title"><div><h1>${title}</h1><p>${sub}</p></div><button class="btn primary" onclick="${fn.name}()">+ Add Record</button></div><div class="card"><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${map(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${heads.length}" class="muted">No records.</td></tr>`}</table></div>`}
function doseRender(){dose.innerHTML=`<div class="title"><div><h1>Veterinary Dose Calculator</h1><p>Calculation aid only. Verify species, indication, formulation, contraindications and current references.</p></div></div><div class="grid two"><div class="card"><div class="form three"><div class="field"><label>Weight (kg)</label><input id="dw" type="number" step=".01" value="12"></div><div class="field"><label>Dose (mg/kg)</label><input id="dd" type="number" step=".01" value="10"></div><div class="field"><label>Concentration (mg/mL)</label><input id="dc" type="number" step=".01" value="50"></div></div><br><button class="btn primary" onclick="calc()">Calculate</button></div><div class="card"><h3>Result</h3><div id="dr" class="muted">Enter values and calculate.</div></div></div><br><div class="card"><b>Formula</b><p class="muted">Total dose = weight × prescribed dose. Volume = total dose ÷ concentration. The calculator does not select a drug or clinical dose.</p></div>`}function calc(){let w=+dw.value,d=+dd.value,c=+dc.value;if(w<=0||d<=0||c<=0)return toast('Enter valid values');dr.innerHTML=`<div class="stat-value">${(w*d).toFixed(2)} mg</div><p>Volume: <b>${(w*d/c).toFixed(2)} mL</b></p>`}
function billRender(){let rows=allRecords('invoices'),col=rows.reduce((s,r)=>s+(+r.paid||0),0),out=rows.reduce((s,r)=>s+total(r.items)-(+r.paid||0),0);billing.innerHTML=`<div class="title"><div><h1>Billing</h1><p>Invoices, payments and outstanding balances.</p></div><button class="btn primary" onclick="invoiceModal()">+ Invoice</button></div><div class="grid three"><div class="card"><div class="muted">Invoices</div><div class="stat-value">${rows.length}</div></div><div class="card"><div class="muted">Collected</div><div class="stat-value">₹${col}</div></div><div class="card"><div class="muted">Outstanding</div><div class="stat-value">₹${out}</div></div></div><br><div class="card"><table class="table"><tr><th>Date</th><th>Patient</th><th>Items</th><th>Total</th><th>Paid</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${date(r.date)}</td><td>${esc(r.patient.name)}</td><td>${esc((r.items||[]).map(i=>i.name).join(', '))}</td><td>₹${total(r.items)}</td><td>₹${r.paid||0}</td><td>${badge(r.status)}</td></tr>`).join('')}</table></div>`}
function invRender(){inventory.innerHTML=`<div class="title"><div><h1>Pharmacy & Inventory</h1><p>Stock, batch, expiry and low-stock control.</p></div><button class="btn primary" onclick="inventoryModal()">+ Add Item</button></div>${db.inventory.filter(x=>x.stock<=x.min).map(x=>`<div class="alert">⚠️ Low stock: <b>${esc(x.name)}</b> — ${x.stock} ${x.unit}</div>`).join('')}<div class="card"><table class="table"><tr><th>Medicine</th><th>Batch</th><th>Stock</th><th>Minimum</th><th>Expiry</th><th>Status</th></tr>${db.inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.batch)}</td><td>${x.stock} ${x.unit}</td><td>${x.min}</td><td>${date(x.expiry)}</td><td>${badge(x.stock<=x.min?'Low':'OK')}</td></tr>`).join('')}</table></div>`}
function reportsRender(){let sp={};db.patients.forEach(x=>sp[x.species]=(sp[x.species]||0)+1);reports.innerHTML=`<div class="title"><div><h1>Reports & Analytics</h1><p>Operational, clinical and financial summaries.</p></div><button class="btn" onclick="window.print()">Print</button></div><div class="grid two"><div class="card"><h3>Species Distribution</h3>${Object.entries(sp).map(([k,v])=>`<div class="kpi"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div class="muted">No data.</div>'}</div><div class="card"><h3>Clinical Records</h3>${['consultations','prescriptions','labs','imaging','surgeries','hospitalizations'].map(k=>`<div class="kpi"><span>${k}</span><b>${allRecords(k).length}</b></div>`).join('')}</div></div>`}
function adminRender(){if(session.role!=='admin')return go('dashboard');admin.innerHTML=`<div class="title"><div><h1>Admin Control Center</h1><p>User management, permissions, audit trail and system overview.</p></div></div><div class="grid four"><div class="card"><div class="muted">Users</div><div class="stat-value">${db.users.length}</div></div><div class="card"><div class="muted">Staff</div><div class="stat-value">${db.users.filter(x=>x.role==='staff').length}</div></div><div class="card"><div class="muted">Owners</div><div class="stat-value">${db.users.filter(x=>x.role==='owner').length}</div></div><div class="card"><div class="muted">Audit Events</div><div class="stat-value">${db.audit.length}</div></div></div><br><div class="grid two"><div class="card"><div class="head"><h3>User Management</h3><button class="btn primary small" onclick="userModal()">+ User</button></div><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th></tr>${db.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${badge(x.role)}</td><td>${esc(x.phone)}</td></tr>`).join('')}</table></div><div class="card"><h3>Audit Trail</h3><div class="table-wrap"><table class="table"><tr><th>Time</th><th>User</th><th>Action</th><th>Record</th></tr>${db.audit.slice().reverse().slice(0,25).map(x=>`<tr><td>${new Date(x.time).toLocaleString('en-IN')}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.type+' '+x.record)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No audit events.</td></tr>'}</table></div></div></div>`}
function settingsRender(){settings.innerHTML=`<div class="title"><div><h1>Settings</h1><p>Clinic profile and prototype data controls.</p></div></div><div class="grid two"><div class="card"><h3>Clinic Profile</h3><br><div class="form">${field('sc','Clinic Name',db.settings.clinic)}${field('sd','Veterinarian',db.settings.doctor)}${field('sr','Registration No.',db.settings.regNo)}${field('sp','Phone',db.settings.phone)}<div class="field span2"><label>Address</label><textarea id="sa">${esc(db.settings.address||'')}</textarea></div></div><br><button class="btn primary" onclick="saveSettings()">Save Settings</button></div><div class="card"><h3>Data Management</h3><p class="muted">Export/import a JSON prototype backup. Production records should use secure server-side backups.</p><div class="actions"><button class="btn cyan" onclick="exportData()">Export JSON</button><label class="btn">Import JSON<input type="file" accept="application/json" hidden onchange="importData(event)"></label><button class="btn danger" onclick="resetData()">Reset Demo</button></div></div></div>`}
function ownerRender(){let rows=db.patients.filter(x=>x.ownerId===session.id);owner.innerHTML=`<div class="title"><div><h1>My Pets</h1><p>Health records, reminders, appointments and documents.</p></div><button class="btn primary" onclick="patientModal()">+ Register Pet</button></div>${rows.map(x=>`<div class="card" style="margin-bottom:12px"><div class="head"><div><h2 style="margin:0">🐾 ${esc(x.name)}</h2><div class="muted">${esc(x.species)} · ${esc(x.breed)} · ${x.weight} kg · ${age(x.dob)}</div></div><button class="btn cyan" onclick="openPatient('${x.id}')">Open Health Record</button></div><div class="grid three"><div><span class="muted">Next Vaccine</span><br><b>${date((x.vaccinations||[]).map(r=>r.next).filter(Boolean).sort()[0])}</b></div><div><span class="muted">Next Deworming</span><br><b>${date((x.deworming||[]).map(r=>r.next).filter(Boolean).sort()[0])}</b></div><div><span class="muted">Allergies</span><br><b>${esc((x.allergies||[]).join(', ')||'None')}</b></div></div></div>`).join('')||'<div class="card muted">No pets linked to this account.</div>'}`}
function reminders(){let a=[];db.patients.forEach(x=>{(x.vaccinations||[]).forEach(r=>r.next&&a.push({date:r.next,type:'Vaccination',item:r.name,patient:x.name,pid:x.id}));(x.deworming||[]).forEach(r=>r.next&&a.push({date:r.next,type:'Deworming',item:r.med,patient:x.name,pid:x.id}))});return a.filter(x=>!session||session.role!=='owner'||p(x.pid)?.ownerId===session.id).sort((a,b)=>a.date.localeCompare(b.date))}function updateCount(){ncount.textContent=reminders().filter(x=>x.date<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)).length}function notifications(){openCustom('Upcoming Reminders',`<table class="table"><tr><th>Due</th><th>Type</th><th>Patient</th><th>Item</th></tr>${reminders().map(x=>`<tr><td>${date(x.date)}</td><td>${x.type}</td><td>${esc(x.patient)}</td><td>${esc(x.item)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No reminders.</td></tr>'}</table>`)}
function field(i,l,v='',type='text'){return `<div class="field"><label>${l}</label><input id="${i}" type="${type}" value="${esc(v)}"></div>`}function select(i,l,opts,val=''){return `<div class="field"><label>${l}</label><select id="${i}">${opts.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function textarea(i,l,v=''){return `<div class="field span2"><label>${l}</label><textarea id="${i}">${esc(v)}</textarea></div>`}function openModal(){modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function openCustom(title,body){modalbox.innerHTML=`<div class="modalhead"><h2 style="margin:0">${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}`;openModal()}
function opts(){return db.patients.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.patientNo)}</option>`).join('')}function ownerOpts(){return db.users.filter(x=>x.role==='owner').map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.email)}</option>`).join('')}
function patientModal(){openCustom('Register Patient',`<form onsubmit="savePatient(event)"><div class="form three">${field('pn','Patient Name')}${field('ps','Species','Dog')}${field('pb','Breed')}${field('px','Sex','Male')}${field('pd','Date of Birth','', 'date')}${field('pw','Weight (kg)','', 'number')}${field('pc','Microchip')}${field('pa','Allergies')}${field('pco','Chronic Conditions')}${session.role==='staff'||session.role==='admin'?select('po','Owner',db.users.filter(x=>x.role==='owner').map(x=>x.name),db.users.find(x=>x.role==='owner')?.name):''}</div><br><button class="btn primary">Save Patient</button></form>`)}
function savePatient(e){e.preventDefault();let ov=db.users.filter(x=>x.role==='owner'),ownerId=session.role==='owner'?session.id:(ov.find(x=>x.name===po.options[po.selectedIndex]?.text.split(' — ')[0])||ov[0])?.id;let x={id:id('p'),patientNo:'VT-'+new Date().getFullYear()+'-'+String(db.patients.length+1).padStart(4,'0'),name:pn.value,species:ps.value,breed:pb.value,sex:px.value,dob:pd.value,weight:+pw.value||0,microchip:pc.value,ownerId,allergies:pa.value?[pa.value]:[],conditions:pco.value?[pco.value]:[],status:'Active',vaccinations:[],deworming:[],consultations:[],prescriptions:[],labs:[],imaging:[],surgeries:[],anesthesia:[],hospitalizations:[],weightHistory:[],invoices:[],documents:[]};db.patients.push(x);audit('Created','Patient',x.patientNo);save();closeModal();toast('Patient registered');render(current);updateCount()}
function appointmentModal(){if(!db.patients.length)return toast('Register a patient first');openCustom('New Appointment',`<form onsubmit="saveAppointment(event)"><div class="form three">${field('ad','Date',today(),'date')}${field('at','Time','10:00','time')}${select('ap','Patient',db.patients.map(x=>x.name))}${field('ar','Reason')}${field('av','Doctor',db.settings.doctor)}${select('as','Status',['Scheduled','Confirmed','Emergency','Completed','Cancelled'])}</div><br><button class="btn primary">Save Appointment</button></form>`)}function saveAppointment(e){e.preventDefault();let x=db.patients.find(x=>x.name===ap.value);db.appointments.push({id:id('a'),patientId:x.id,date:ad.value,time:at.value,reason:ar.value,doctor:av.value,status:as.value});audit('Created','Appointment',x.name);save();closeModal();toast('Appointment saved');go('appointments')}
function consultModal(pid){pid=pid||db.patients[0]?.id;if(!pid)return toast('Register a patient first');openCustom('Clinical Consultation',`<form onsubmit="saveConsult(event)"><input type="hidden" id="cp" value="${pid}"><div class="form three">${field('cd','Date',today(),'date')}${field('cv','Veterinarian',db.settings.doctor)}${field('ct','Temperature')}${field('cpl','Pulse')}${field('cr','Respiration')}${field('ccrt','CRT')}${field('cmm','Mucous Membrane')}${field('ch','Hydration')}${field('cbcs','BCS')}${field('cps','Pain Score')}</div><br><div class="form">${textarea('ccompl','Chief Complaint')}${textarea('chist','History')}${textarea('cfind','Clinical Findings')}${textarea('cdiff','Differential Diagnosis')}${field('cdiag','Diagnosis')}${textarea('cplan','Treatment / Plan')}${textarea('cfollow','Follow-up')}</div><br><button class="btn primary">Save Consultation</button></form>`)}function saveConsult(e){e.preventDefault();let x=p(cp.value),r={id:id('c'),date:cd.value,vet:cv.value,complaint:ccompl.value,history:chist.value,findings:cfind.value,differential:cdiff.value,diagnosis:cdiag.value,plan:cplan.value,follow:cfollow.value,exam:{temp:ct.value,pulse:cpl.value,resp:cr.value,crt:ccrt.value,mm:cmm.value,hydration:ch.value,bcs:cbcs.value,pain:cps.value}};x.consultations.push(r);x.weightHistory.push({date:r.date,weight:x.weight});audit('Created','Consultation',x.name);save();closeModal();toast('Consultation saved');render(current)}
function vaccineModal(pid){pid=pid||db.patients[0]?.id;openCustom('Vaccination Record',`<form onsubmit="saveVaccine(event)"><input type="hidden" id="vp" value="${pid}"><div class="form three">${field('vn','Vaccine Name')}${field('vd','Date Administered',today(),'date')}${field('vnext','Next Due','','date')}${field('vv','Veterinarian',db.settings.doctor)}${field('vb','Batch')}${field('vr','Route')}${field('vsite','Site')}${select('vs','Status',['Done','Scheduled','Overdue'])}</div><br><button class="btn primary">Save Vaccine</button></form>`)}function saveVaccine(e){e.preventDefault();p(vp.value).vaccinations.push({id:id('v'),name:vn.value,date:vd.value,next:vnext.value,vet:vv.value,batch:vb.value,route:vr.value,site:vsite.value,status:vs.value});audit('Created','Vaccination',p(vp.value).name);save();closeModal();toast('Vaccination saved');render(current)}
function dewormModal(pid){pid=pid||db.patients[0]?.id;openCustom('Deworming / Parasite Control',`<form onsubmit="saveDeworm(event)"><input type="hidden" id="dp" value="${pid}"><div class="form three">${field('dm','Product / Active Ingredient')}${field('ddate','Date',today(),'date')}${field('dn','Next Due','','date')}${field('ddose','Dose')}${field('droute','Route')}${field('dt','Target Parasite')}${field('dv','Veterinarian',db.settings.doctor)}</div><br><button class="btn primary">Save Record</button></form>`)}function saveDeworm(e){e.preventDefault();p(dp.value).deworming.push({id:id('d'),med:dm.value,date:ddate.value,next:dn.value,dose:ddose.value,route:droute.value,target:dt.value,vet:dv.value,status:'Done'});audit('Created','Deworming',p(dp.value).name);save();closeModal();toast('Deworming saved');render(current)}

function handleRxFile(e){
  let f=e.target.files[0];
  if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    document.getElementById('rxImageData').value=r.result;
    let prev=document.getElementById('rxPreview');
    if(f.type.startsWith('image/')){
      prev.innerHTML=`<img src="${r.result}" style="max-height:140px;border-radius:10px;border:1px solid var(--border);margin-top:6px;">`;
    }else{
      prev.innerHTML=`<span class="badge info" style="margin-top:6px">File Attached: ${esc(f.name)}</span>`;
    }
  };
  r.readAsDataURL(f);
}

function rxModal(pid){
  pid=pid||db.patients[0]?.id;
  if(!pid)return toast('Register a patient first');
  openCustom('Prescription',`<form onsubmit="saveRx(event)">
    <input type="hidden" id="rp" value="${pid}">
    <input type="hidden" id="rxImageData" value="">
    <div class="form three">
      ${field('rd','Date',today(),'date')}
      ${field('rv','Veterinarian',db.settings.doctor)}
      <div class="field span2">
        <label>Upload Prescription Image / File (Optional)</label>
        <input id="rxfile" type="file" accept="image/*,.pdf" onchange="handleRxFile(event)">
      </div>
    </div>
    <div id="rxPreview"></div>
    <br><div class="muted" style="margin-bottom:8px"><b>Or</b> fill prescription details below (Optional if file uploaded):</div>
    <div class="form three">
      ${field('rm','Medicine')}
      ${field('rdo','Dose')}
      ${field('rcon','Concentration')}
      ${field('rr','Route')}
      ${field('rf','Frequency')}
      ${field('rdu','Duration')}
      ${field('rq','Quantity')}
    </div>
    <br>
    <div class="form">
      ${textarea('ra','Advice / Instructions')}
    </div>
    <br><button class="btn primary">Save Prescription</button>
  </form>`);
}

function saveRx(e){
  e.preventDefault();
  let imgData=document.getElementById('rxImageData').value;
  let med=rm.value.trim();
  if(!med && !imgData) return toast('Please enter medicine details OR upload a prescription file');

  let r={
    id:id('rx'),
    date:rd.value,
    vet:rv.value,
    medicine:med||'Uploaded Prescription File',
    dose:rdo.value,
    concentration:rcon.value,
    route:rr.value,
    frequency:rf.value,
    duration:rdu.value,
    quantity:rq.value,
    advice:ra.value,
    image:imgData
  };
  p(rp.value).prescriptions.push(r);
  audit('Created','Prescription',p(rp.value).name);
  save();
  closeModal();
  toast('Prescription saved');
  render(current);
}

function printRx(pid,rid){
  let x=p(pid),r=x.prescriptions.find(a=>a.id===rid),o=u(x.ownerId),w=window.open('','_blank');
  let detailsHtml = (r.dose || r.route || r.frequency || r.advice) ? `
    <p>Dose: ${esc(r.dose||'—')} · Concentration: ${esc(r.concentration||'—')}</p>
    <p>Route: ${esc(r.route||'—')} · Frequency: ${esc(r.frequency||'—')} · Duration: ${esc(r.duration||'—')}</p>
    <p>Quantity: ${esc(r.quantity||'—')}</p>
    <p>Advice: ${esc(r.advice||'—')}</p>
  ` : '';
  let imgHtml = r.image ? `<div style="margin-top:20px;"><h3>Attached Prescription Document</h3><img src="${r.image}" style="max-width:100%;max-height:600px;border:1px solid #ccc;border-radius:8px;"/></div>` : '';

  w.document.write(`<html><head><title>Prescription — ${esc(x.name)}</title><style>body{font:14px Arial;padding:40px;color:#111;max-width:800px;margin:auto}h1{margin-bottom:3px}.line{padding:9px 0;border-bottom:1px solid #ddd}.rx{margin-top:25px;font-size:16px}</style></head><body><h1>${esc(db.settings.clinic)}</h1><div>${esc(db.settings.doctor)} · ${esc(db.settings.regNo)} · ${esc(db.settings.phone)}</div><hr><h2>Prescription</h2><div class="line"><b>Patient:</b> ${esc(x.name)} · ${esc(x.species)} · ${x.weight} kg · Owner: ${esc(o.name)}</div><div class="rx"><b>Rx</b><p><b>${esc(r.medicine)}</b></p>${detailsHtml}${imgHtml}</div><br><br>Veterinarian signature: __________________</body></html>`);
  w.document.close();
  w.print();
}

function imgModal(pid){pid=pid||db.patients[0]?.id;openCustom('Imaging / ECG',`<form onsubmit="saveImg(event)"><input type="hidden" id="ip" value="${pid}"><div class="form">${field('idate','Date',today(),'date')}${select('itype','Type',['X-ray','Ultrasound','ECG','CT','MRI','Other'])}${field('ireg','Region / Lead')}${textarea('ifind','Findings')}${textarea('iimp','Impression')}${textarea('ipar','Parameters / Measurements')}</div><br><button class="btn primary">Save Study</button></form>`)}function saveImg(e){e.preventDefault();p(ip.value).imaging.push({id:id('img'),date:idate.value,type:itype.value,region:ireg.value,findings:ifind.value,impression:iimp.value,params:ipar.value});audit('Created','Imaging',p(ip.value).name);save();closeModal();toast('Imaging record saved');render(current)}
function surgModal(pid){pid=pid||db.patients[0]?.id;openCustom('Surgical Record',`<form onsubmit="saveSurg(event)"><input type="hidden" id="surgp" value="${pid}"><div class="form">${field('sdate','Date',today(),'date')}${field('sproc','Procedure')}${field('ssurgeon','Surgeon',db.settings.doctor)}${textarea('sind','Indication')}${textarea('san','Anesthesia Protocol')}${textarea('stech','Surgical Technique')}${field('ssut','Suture Material')}${field('scomp','Complications')}${textarea('sout','Outcome / Post-op Plan')}</div><br><button class="btn primary">Save Surgery</button></form>`)}function saveSurg(e){e.preventDefault();p(surgp.value).surgeries.push({id:id('surg'),date:sdate.value,procedure:sproc.value,surgeon:ssurgeon.value,indication:sind.value,anesthesia:san.value,technique:stech.value,suture:ssut.value,complications:scomp.value,outcome:sout.value});audit('Created','Surgery',p(surgp.value).name);save();closeModal();toast('Surgery saved');render(current)}
function anModal(pid){pid=pid||db.patients[0]?.id;openCustom('Anesthesia Record',`<form onsubmit="saveAn(event)"><input type="hidden" id="anp" value="${pid}"><div class="form">${field('and','Date',today(),'date')}${field('ana','ASA')}${textarea('anprem','Premedication')}${textarea('anind','Induction')}${textarea('anmain','Maintenance')}${field('analg','Analgesia')}${field('anflu','Fluid Plan')}${textarea('anotes','Monitoring / Notes')}</div><br><button class="btn primary">Save Record</button></form>`)}function saveAn(e){e.preventDefault();p(anp.value).anesthesia.push({id:id('an'),date:and.value,asa:ana.value,premed:anprem.value,induction:anind.value,maintenance:anmain.value,analgesia:anlg.value,fluids:anflu.value,notes:anotes.value});audit('Created','Anesthesia',p(anp.value).name);save();closeModal();toast('Anesthesia record saved');render(current)}
function hospModal(pid){pid=pid||db.patients[0]?.id;openCustom('Hospital Admission',`<form onsubmit="saveHosp(event)"><input type="hidden" id="hp" value="${pid}"><div class="form">${field('ha','Admission',today(),'date')}${field('hd','Discharge','','date')}${field('hw','Ward / Cage')}${field('hf','IV Fluids')}${field('hm','Medications')}${textarea('hprog','Progress Notes')}${select('hst','Status',['Admitted','Discharged','Transferred'])}</div><br><button class="btn primary">Save Admission</button></form>`)}function saveHosp(e){e.preventDefault();p(hp.value).hospitalizations.push({id:id('h'),admit:ha.value,discharge:hd.value,ward:hw.value,fluids:hf.value,meds:hm.value,progress:hprog.value,status:hst.value});audit('Created','Hospitalization',p(hp.value).name);save();closeModal();toast('Hospital record saved');render(current)}
function invoiceModal(pid){pid=pid||db.patients[0]?.id;if(!pid)return toast('Register a patient first');openCustom('Invoice',`<form onsubmit="saveInvoice(event)"><input type="hidden" id="invp" value="${pid}"><div class="form three">${field('invd','Date',today(),'date')}${field('invi','Item / Service')}${field('invq','Quantity','1','number')}${field('invprice','Unit Price','0','number')}${field('invpaid','Amount Paid','0','number')}${select('invs','Status',['Pending','Paid','Partial'])}</div><br><button class="btn primary">Create Invoice</button></form>`)}function saveInvoice(e){e.preventDefault();p(invp.value).invoices.push({id:id('inv'),date:invd.value,items:[{name:invi.value,qty:+invq.value||1,price:+invprice.value||0}],paid:+invpaid.value||0,status:invs.value});audit('Created','Invoice',p(invp.value).name);save();closeModal();toast('Invoice created');render(current)}
function docModal(pid){pid=pid||db.patients[0]?.id;openCustom('Document Record',`<form onsubmit="saveDoc(event)"><input type="hidden" id="docp" value="${pid}"><div class="form">${field('docn','Document Name')}${field('docd','Date',today(),'date')}${field('doct','Type')}${field('docr','Secure File Reference / URL')}</div><br><button class="btn primary">Save Document</button></form>`)}function saveDoc(e){e.preventDefault();p(docp.value).documents.push({id:id('doc'),name:docn.value,date:docd.value,type:doct.value,ref:docr.value});audit('Created','Document',p(docp.value).name);save();closeModal();toast('Document saved');render(current)}
function inventoryModal(){openCustom('Add Inventory Item',`<form onsubmit="saveInv(event)"><div class="form three">${field('mn','Medicine / Product')}${field('mb','Batch')}${field('ms','Stock','0','number')}${field('mmi','Minimum Stock','10','number')}${field('me','Expiry','','date')}${field('mu','Unit','tablet')}</div><br><button class="btn primary">Save Item</button></form>`)}function saveInv(e){e.preventDefault();db.inventory.push({id:id('m'),name:mn.value,batch:mb.value,stock:+ms.value||0,min:+mmi.value||0,expiry:me.value,unit:mu.value});audit('Created','Inventory',mn.value);save();closeModal();toast('Inventory item added');render('inventory')}
function userModal(){openCustom('Create User',`<form onsubmit="saveUser(event)"><div class="form">${field('un','Name')}${field('ue','Email','','email')}${field('up','Password')}${select('ur','Role',['staff','owner','admin'])}${field('uph','Phone')}</div><br><button class="btn primary">Create User</button></form>`)}function saveUser(e){e.preventDefault();if(db.users.some(x=>x.email.toLowerCase()===ue.value.toLowerCase()))return toast('Email already exists');db.users.push({id:id('u'),name:un.value,email:ue.value,password:up.value,role:ur.value,phone:uph.value});audit('Created','User',ue.value);save();closeModal();toast('User created');render('admin')}
function saveSettings(){db.settings={clinic:sc.value,doctor:sd.value,regNo:sr.value,phone:sp.value,address:sa.value};audit('Updated','Settings','Clinic profile');save();toast('Settings saved');go('dashboard')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='vetera-v2-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.users||!x.patients)throw 0;db=x;save();toast('Backup restored');render(current);updateCount()}catch{toast('Invalid Vetera backup')}};r.readAsText(f)}function resetData(){if(confirm('Reset all Vetera demo data?')){localStorage.removeItem(KEY);location.reload()}}
function ensure(){db.patients.forEach(x=>['vaccinations','deworming','consultations','prescriptions','labs','imaging','surgeries','anesthesia','hospitalizations','invoices','documents','weightHistory','allergies','conditions'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]}));if(!db.audit)db.audit=[];save()}ensure();window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
